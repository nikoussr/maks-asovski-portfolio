<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Портфолио</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="admin-body">
  <div class="admin-login">
    <div class="admin-login-box">
      <h1 class="admin-login-title">Максим Асовский</h1>
      <p class="admin-login-subtitle">Панель управления</p>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login">
        <div class="form-group">
          <label class="form-label" for="username">Логин</label>
          <input class="form-control" type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
          Войти
        </button>
      </form>
    </div>
  </div>
</body>
</html>

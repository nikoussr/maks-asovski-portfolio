version: "3.9"

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/postgres
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/uploads

networks:
  portfolio_net:
